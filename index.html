<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#181818"><meta name="description" content="An offline turn-based adventure. Your journey, saved on your device."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png">
<title>Nomad</title>
<style>
:root{color-scheme:dark;--bg:#181818;--panel:#212121;--line:#3a3a3a;--muted:#ababab;--ink:#e9e9e9;--accent:#b0b0b0;--accent-secondary:#a6a6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 80% 0%,#55555530,transparent 55%)}header,main,footer{max-width:1240px;margin:auto;padding:24px 36px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:30px;letter-spacing:8px}.brand span{color:var(--accent)}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:11px;color:var(--accent)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{opacity:.5;cursor:wait}.quiet{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:9px 16px}.intro{display:flex;justify-content:space-between;align-items:end;margin:18px 0 32px;gap:20px}h1{font:normal clamp(32px,4vw,52px)/1.2 Georgia,serif;margin:8px 0 10px}.subtitle{color:var(--muted);margin:0}.chapter{color:var(--muted);font-size:13px;white-space:nowrap}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.sheet{padding:24px;align-self:start}.portrait{width:56px;height:56px;display:grid;place-items:center;background:#3b3b3b;color:var(--accent);border:1px solid #626262;border-radius:50%;font:28px Georgia;margin-bottom:15px}.sheet h2{font:24px Georgia;margin:0 0 4px}.small{color:var(--muted);font-size:13px}.health{margin:24px 0}.health-label{display:flex;justify-content:space-between;font-size:13px}.bar{height:6px;background:#363636;border-radius:5px;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--accent-secondary);transition:width .3s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.stat b{display:block;font-size:22px;font-weight:500}.stat span{color:var(--muted);font-size:12px}.gear{padding-top:20px;border-top:1px solid var(--line);font-size:13px}.gear p{margin:8px 0}.gear span{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px}.journey{overflow:hidden}.scene-heading{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.scene-heading h2{font:25px Georgia;margin:2px 0}.badge{color:var(--accent-secondary);background:#a6a6a614;border:1px solid #a6a6a638;border-radius:30px;padding:4px 12px;font-size:12px}.story{padding:26px 28px;max-height:380px;min-height:210px;overflow:auto;scrollbar-color:var(--line) transparent;white-space:pre-wrap;font-size:15px}.story p{margin:0 0 7px}.story .divider{margin:22px 0;border:0;border-top:1px dashed var(--line)}.choices{padding:24px 28px 28px;background:#1b1b1b;border-top:1px solid var(--line)}.choices h3{font:22px Georgia;margin:0 0 18px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{background:#2e2e2e;border:1px solid #4a4a4a;border-radius:6px;color:var(--ink);padding:13px 16px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:background .15s,transform .15s;min-height:52px}.action:hover{background:#393939;transform:translateY(-1px)}.action:first-child{border-color:#a6a6a680}.action span:last-child:after{content:"";display:block;width:7px;height:7px;border-top:1px solid var(--accent-secondary);border-right:1px solid var(--accent-secondary);transform:rotate(45deg)}.status{min-height:24px;color:var(--muted);font-size:13px;margin-top:12px}.error{color:#bdbdbd}footer{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px;margin-top:18px;padding-bottom:40px}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:28px;max-width:420px}dialog::backdrop{background:#0009}dialog h2{font:28px Georgia}dialog menu{padding:0;display:flex;gap:12px;justify-content:end}@media(max-width:760px){header,main,footer{padding:20px}.layout{grid-template-columns:1fr}.sheet{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.portrait{display:none}.health{margin:14px 0}.stats{grid-column:1/-1;grid-template-columns:repeat(4,1fr);margin:10px 0}.gear{grid-column:1/-1;display:flex;gap:25px;margin-top:12px}.intro{display:block}.chapter{margin-top:16px}.scene-heading,.story,.choices{padding:20px}.story{max-height:300px}.buttons{grid-template-columns:1fr}footer{flex-direction:column;gap:4px}}

[hidden]{display:none!important}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.offline-note{max-width:1240px;margin:auto;padding:0 36px;color:var(--muted);font-size:13px}.storage-warning{color:#bdbdbd;padding:12px 0}button{touch-action:manipulation}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="brand">NOMAD</div><div class="tools"><button class="quiet" id="install" hidden>Install game</button><button class="quiet" id="update" hidden>Update ready · Reload</button><button class="quiet" id="new-game">New journey</button></div></header>
<p class="offline-note" id="offline-status" role="alert" hidden></p><main>
<div class="intro"><div class="chapter" id="progress">Preparing your journey…</div></div>
<div class="layout">
<aside class="card sheet" aria-label="Character stats"><div><h2>Character</h2></div><div class="health"><div class="health-label"><span>Health</span><strong id="hp">—</strong></div><div class="bar" role="progressbar" aria-label="Health" id="hp-bar"><i></i></div><span class="small" id="condition">Alcohol level · 0%</span></div><div class="stats"><div class="stat"><b id="attack">—</b><span>Attack</span></div><div class="stat"><b id="defence">—</b><span>Defence</span></div><div class="stat"><b id="gold">—</b><span>Gold coins</span></div><div class="stat"><b id="moves">—</b><span>Moves</span></div></div><div class="gear"><p><span>Weapon</span><strong id="weapon">—</strong></p><p><span>Armor</span><strong id="armor">—</strong></p></div></aside>
<section class="card journey" aria-label="Your journey"><div class="scene-heading"><div><h2 id="location">A new beginning</h2></div><span class="badge" id="mode">Adventure</span></div><div class="story" id="story" role="log" aria-label="Adventure log" aria-live="polite"></div><div class="choices"><h3 id="question">Loading…</h3><div class="buttons" id="actions"></div><div class="status" id="status" role="status"></div></div></section>
</div>
<div class="tools" style="margin-top:24px"><button class="quiet" id="export">Export save</button><button class="quiet" id="import">Import save</button><input type="file" accept="application/json,.json" id="save-file" hidden></div><p class="storage-warning" id="save-error" role="alert" hidden></p></main>
<dialog id="restart-dialog"><h2>Take a new road?</h2><p>This ends your current journey and starts again with a fresh character.</p><menu><button class="quiet" id="cancel-restart">Keep playing</button><button class="action" id="confirm-restart">Start again</button></menu></dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
